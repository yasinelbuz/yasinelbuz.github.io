  <!-- Mouth -->
  <path d="M44 62 Q 47 65 50 62 Q 53 65 56 62" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <!-- Red Cheeks -->
  <circle cx="23" cy="62" r="7" fill="#FF1A1A"/>
  <circle cx="77" cy="62" r="7" fill="#FF1A1A"/>
</svg>
