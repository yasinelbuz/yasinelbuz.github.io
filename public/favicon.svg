  <polygon points="8,4 16,16 26,38" fill="#1A1A1A"/>
  <!-- Pikachu Right Ear -->
  <polygon points="74,38 92,4 62,20" fill="#FFDE00" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="92,4 84,16 74,38" fill="#1A1A1A"/>
  <!-- Head -->
  <ellipse cx="50" cy="56" rx="38" ry="34" fill="#FFDE00" stroke="#1A1A1A" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="36" cy="50" r="5" fill="#1A1A1A"/>
  <circle cx="34" cy="48" r="2" fill="#FFFFFF"/>
  <circle cx="64" cy="50" r="5" fill="#1A1A1A"/>
  <circle cx="62" cy="48" r="2" fill="#FFFFFF"/>
  <!-- Nose -->
